name: windows-build

on:
  push:
    branches: [master, main]
    paths:
      - 'windows/**'
      - 'winget/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'winget/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows extension
    runs-on: windows-latest
    env:
      DEV_CERT_PASSWORD: dsh-local-dev-cert
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows/ItsycalForWindows.sln -p:Platform=x64

      # The provider library is the only project in this slice that ships for ARM64; building it
      # here keeps the ARM64 compile honest until the MSIX packaging job covers ARM64 too.
      - name: Restore and build the provider library (Debug, ARM64)
        shell: pwsh
        run: |
          dotnet restore windows/src/ItsycalForWindows.Providers/ItsycalForWindows.Providers.csproj -p:Platform=ARM64
          dotnet build windows/src/ItsycalForWindows.Providers/ItsycalForWindows.Providers.csproj -c Debug -p:Platform=ARM64 --no-restore

      - name: Stamp a unique development package version
        shell: pwsh
        run: |
          # Development builds must be newer than the latest published release, otherwise
          # Add-AppxPackage rejects the dev MSIX as a downgrade. Derive the base from the
          # newest release tag and bump only the revision.
          $tags = @(git tag --list 'v*' --sort=-version:refname)
          if ($tags.Count -eq 0) {
            throw 'No v* release tag was found; refusing to build a dev package below the released version.'
          }
          $latest = $tags[0]
          if ($latest -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Latest release tag '$latest' is not vX.Y.Z; cannot derive the development base."
          }
          $baseVersion = $Matches['version']
          $revision = ([int]$env:GITHUB_RUN_NUMBER % 65534) + 1
          $parts = $baseVersion.Split('.')
          $devVersion = '{0}.{1}.{2}.{3}' -f $parts[0], $parts[1], $parts[2], $revision
          if ([version]$devVersion -le [version]('{0}.0' -f $baseVersion)) {
            throw "Computed development version $devVersion is not newer than the release base $baseVersion.0."
          }
          Write-Host "Development package version: $devVersion (base $baseVersion from the latest release tag)."
          ./windows/scripts/Set-PackageVersion.ps1 -Version $devVersion

      - name: Build and package MSIX (Debug, x64)
        run: >
          dotnet build windows/src/ItsycalForWindows/ItsycalForWindows.csproj -c Debug -p:Platform=x64 --no-restore
          -p:GenerateAppxPackageOnBuild=true
          -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true
          -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir="${{ github.workspace }}\windows\artifacts\msix\"

      - name: Run unit tests with coverage
        run: >
          dotnet test windows/tests/ItsycalForWindows.Tests/ItsycalForWindows.Tests.csproj -c Debug
          --collect:"XPlat Code Coverage"
          --results-directory windows/artifacts/coverage
          --settings windows/tests/coverlet.runsettings

      - name: Enforce the coverage floor
        shell: pwsh
        run: |
          $coverage = @(Get-ChildItem 'windows/artifacts/coverage' -Recurse -Filter 'coverage.cobertura.xml' -ErrorAction SilentlyContinue)
          if ($coverage.Count -ne 1) {
            Write-Error "Expected exactly one coverage.cobertura.xml, found $($coverage.Count)."
            exit 1
          }

          [xml]$document = Get-Content -LiteralPath $coverage[0].FullName -Raw
          $lineRate = [double]::Parse($document.coverage.'line-rate', [System.Globalization.CultureInfo]::InvariantCulture)
          $rawPercent = $lineRate * 100
          $percent = [math]::Round($rawPercent, 1)
          $floor = 30.0

          "### Code coverage" >> $env:GITHUB_STEP_SUMMARY
          "Line coverage: **$percent%** (floor: $floor%; baseline 2026-11-08 was 30.7%. Raise the floor as tests are added, never lower it without a documented reason.)" >> $env:GITHUB_STEP_SUMMARY
          "Report: $($coverage[0].FullName)" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Line coverage: $percent% (floor: $floor%)"

          if ($rawPercent -lt $floor) {
            Write-Error "Line coverage $percent% is below the $floor% floor. Add tests or adjust the floor with a documented reason."
            exit 1
          }

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itsycal-coverage
          path: windows/artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Locate the MSIX package
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path 'windows\artifacts' -Recurse -Filter *.msix -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $msix) {
            Write-Error 'No .msix package was produced by the build.'
            exit 1
          }
          "PACKAGE=$($msix.FullName)" | Tee-Object -FilePath 'windows\artifacts\package-path.txt'
          "MSIX_PATH=$($msix.FullName)" >> $env:GITHUB_ENV

      - name: Sign the MSIX with the development certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $PWD 'windows\artifacts\devcert.pfx'
          if ($env:SIGNING_PFX_BASE64) {
            Write-Output 'Signing with the repository development certificate.'
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = $env:SIGNING_PFX_PASSWORD
          }
          else {
            Write-Output 'No SIGNING_PFX_BASE64 secret: creating an ephemeral development certificate.'
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject 'CN=ItsycalForWindows-Dev' `
              -KeyUsage DigitalSignature `
              -FriendlyName 'Itsycal for Windows dev signing' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
            $secure = ConvertTo-SecureString -String $env:DEV_CERT_PASSWORD -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $secure | Out-Null
            $password = $env:DEV_CERT_PASSWORD
          }

          # Publish the matching public certificate next to the package so anyone can verify
          # which certificate signed the artifact.
          $publicCert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $password)
          Export-Certificate -Cert $publicCert -FilePath 'windows\artifacts\devcert.cer' | Out-Null
          Write-Output "Signing certificate thumbprint: $($publicCert.Thumbprint)"

          # Trust the certificate in the runner's user store so the package can be verified.
          Import-Certificate -FilePath 'windows\artifacts\devcert.cer' -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { Write-Error 'signtool.exe not found in the Windows SDK'; exit 1 }

          & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $password "$env:MSIX_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "Signed package: $env:MSIX_PATH"
          Remove-Item $pfxPath -Force

      - name: Upload the development package
        uses: actions/upload-artifact@v4
        with:
          name: itsycal-for-windows-dev
          path: |
            windows/artifacts/**/*.msix
            windows/artifacts/**/*.cer
            windows/artifacts/package-path.txt
          if-no-files-found: error

  flyout-spike:
    name: Build WinUI 3 flyout spike
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore the flyout spike for win-x64
        run: >
          dotnet restore windows/src/ItsycalForWindows.Flyout/ItsycalForWindows.Flyout.csproj
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64

      # The project keeps EnableMsixTooling=false for local unpackaged runs. CI turns it on:
      # Microsoft.Windows.SDK.BuildTools.MSIX 1.7.251221100 only wires the project PRI into the
      # publish item list (AddProjectPriToResolvedFileToPublish) on the MSIX tooling path. The
      # MrtCore path writes ItsycalForWindows.Flyout.pri into bin and never publishes it. Because
      # WindowsPackageType=None leaves AppxPackage=false, the tooling would name the file
      # ItsycalForWindows.Flyout.pri; ProjectPriFileName pins the well-known resources.pri name.
      - name: Build and publish the flyout spike (Release, win-x64, self-contained, unpackaged)
        run: >
          dotnet publish windows/src/ItsycalForWindows.Flyout/ItsycalForWindows.Flyout.csproj
          -c Release
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true
          -p:WindowsPackageType=None
          -p:EnableMsixTooling=true
          -p:ProjectPriFileName=resources.pri
          -p:WindowsAppSDKSelfContained=true
          --no-restore
          -o windows/artifacts/flyout-spike

      # Unpackaged MRT Core resolves resources from <exe>.pri by default, while the MSIX tooling
      # emits resources.pri. Keep both names so the spike launches in either configuration.
      - name: Add the unpackaged MRT Core PRI alias
        shell: pwsh
        run: |
          $output = 'windows/artifacts/flyout-spike'
          $mainPri = Join-Path $output 'resources.pri'
          $appPri = Join-Path $output 'ItsycalForWindows.Flyout.pri'
          if (-not (Test-Path -LiteralPath $mainPri)) {
            Write-Error 'resources.pri was not published; the MSIX PRI tooling did not run.'
            exit 1
          }
          if (-not (Test-Path -LiteralPath $appPri)) {
            Copy-Item -LiteralPath $mainPri -Destination $appPri
            Write-Host "Created $appPri from resources.pri for unpackaged MRT Core lookup."
          }

      - name: Verify the publish output (exe, resources.pri, WinAppSDK runtime)
        shell: pwsh
        run: |
          $output = 'windows/artifacts/flyout-spike'
          $required = @(
            'ItsycalForWindows.Flyout.exe',
            'ItsycalForWindows.Flyout.dll',
            'ItsycalForWindows.Flyout.pri',
            'resources.pri',
            'coreclr.dll',
            'hostfxr.dll',
            'Microsoft.ui.xaml.dll',
            'Microsoft.WindowsAppRuntime.dll'
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $output $_)) })
          if ($missing.Count -gt 0) {
            Write-Error ("Missing publish output: {0}" -f ($missing -join ', '))
            exit 1
          }
          $files = @(Get-ChildItem $output -Recurse -File)
          $sizeMb = [math]::Round((($files | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "Publish output: $($files.Count) files, $sizeMb MB."
          "### Flyout spike" >> $env:GITHUB_STEP_SUMMARY
          "Published to ``windows/artifacts/flyout-spike``: $($files.Count) files, $sizeMb MB (win-x64, self-contained with coreclr.dll/hostfxr.dll, unpackaged)." >> $env:GITHUB_STEP_SUMMARY
          "Required layout verified: exe/dll, resources.pri plus the ItsycalForWindows.Flyout.pri alias, coreclr.dll, hostfxr.dll and the WinAppSDK runtime DLLs." >> $env:GITHUB_STEP_SUMMARY

      - name: Sign the published flyout with the development certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'windows/artifacts/flyout-spike'

          function Add-SummaryLine([string] $line) {
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $line
            }
          }

          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Warning ('SIGNING_PFX_BASE64 is not configured: the flyout artifact is UNSIGNED. ' +
              'Windows SmartScreen will warn and other machines will not trust the binaries. ' +
              'Configure SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD to sign this job.')
            Add-SummaryLine '### Flyout signing'
            Add-SummaryLine ''
            Add-SummaryLine '**Unsigned artifact.** `SIGNING_PFX_BASE64` is not configured, so the published binaries were not Authenticode-signed. SmartScreen will warn; this is expected for pull requests from forks, which cannot read repository secrets.'
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'SIGNING_PFX_BASE64 is configured without SIGNING_PFX_PASSWORD; refusing to sign with an unknown password.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'itsycal-flyout.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $certificate = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:SIGNING_PFX_PASSWORD)

            # The development certificate is not timestamped: Authenticode reports NotTimeValid
            # once it expires, so refuse to sign with an expired certificate instead of shipping an
            # artifact whose signature every tester must ignore.
            if ($certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
              throw ("The development signing certificate expired on {0:yyyy-MM-dd}; refusing to sign the flyout." -f $certificate.NotAfter)
            }
            Write-Host "Development certificate NotAfter: $($certificate.NotAfter.ToString('yyyy-MM-dd'))"

            $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source
            if (-not $signtool) {
              $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $signtool) {
              $signtool = Get-ChildItem (Join-Path $env:USERPROFILE '.nuget\packages\microsoft.windows.sdk.buildtools') -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $signtool) {
              throw 'signtool.exe was not found on PATH, under C:\Program Files (x86)\Windows Kits\10\bin, or in the restored Microsoft.Windows.SDK.BuildTools package.'
            }
            Write-Host "Using signtool: $signtool"

            $rows = @()
            $failed = @()
            foreach ($fileName in @('ItsycalForWindows.Flyout.exe', 'ItsycalForWindows.Flyout.dll')) {
              $filePath = Join-Path $output $fileName
              if (-not (Test-Path -LiteralPath $filePath)) {
                throw "The publish output is missing $fileName."
              }

              & $signtool sign /fd SHA256 /f $pfxPath /p $env:SIGNING_PFX_PASSWORD $filePath
              if ($LASTEXITCODE -ne 0) {
                throw "signtool sign failed for $fileName (exit code $LASTEXITCODE)."
              }

              $signature = Get-AuthenticodeSignature -FilePath $filePath
              $thumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { '(none)' }
              $matchesPfx = $signature.SignerCertificate -and ($signature.SignerCertificate.Thumbprint -eq $certificate.Thumbprint)
              $signerExpired = $signature.SignerCertificate -and
                ($signature.SignerCertificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow)
              # The development certificate is self-signed, so a fresh runner reports UnknownError
              # (untrusted root) even though the signature itself verifies. Fail only when the
              # signature is absent/broken, was produced by a different certificate, or the signer
              # certificate is outside its validity window (NotTimeValid without a timestamp).
              $broken = $signature.Status -in @('NotSigned', 'HashMismatch', 'NotSupportedFileFormat', 'Incompatible', 'NotTimeValid')
              if ($broken -or -not $matchesPfx -or $signerExpired) {
                $expires = if ($signature.SignerCertificate) {
                  $signature.SignerCertificate.NotAfter.ToString('yyyy-MM-dd')
                }
                else {
                  '(none)'
                }
                $failed += ("{0}: status '{1}', signer {2}, cert expires {3}" -f $fileName, $signature.Status, $thumbprint, $expires)
              }
              $rows += ("| {0} | {1} | {2} |" -f $fileName, $signature.Status, $thumbprint)
            }

            # Publish the matching public certificate next to the signed binaries so testers can
            # trust the development signature without receiving the PFX or its password. The file
            # is uploaded with the rest of the flyout artifact.
            $cerPath = Join-Path $output 'devcert.cer'
            Export-Certificate -Cert $certificate -FilePath $cerPath -Type CERT -Force | Out-Null
            if (-not (Test-Path -LiteralPath $cerPath)) {
              throw "Could not export the public development certificate to $cerPath."
            }
            $cerHash = (Get-FileHash -LiteralPath $cerPath -Algorithm SHA256).Hash
            Write-Host "Exported public certificate: $cerPath (SHA256 $cerHash)."

            Add-SummaryLine '### Flyout signing'
            Add-SummaryLine ''
            Add-SummaryLine ('Certificate: {0} (thumbprint {1}, expires {2:yyyy-MM-dd}).' -f $certificate.Subject, $certificate.Thumbprint, $certificate.NotAfter)
            Add-SummaryLine ("Exported public certificate for testers: ``$cerPath`` (SHA256 ``$cerHash``).")
            Add-SummaryLine ''
            Add-SummaryLine '| File | Authenticode status | Signer thumbprint |'
            Add-SummaryLine '|---|---|---|'
            foreach ($row in $rows) {
              Add-SummaryLine $row
            }

            if (@($rows | Where-Object { $_ -notmatch '\| Valid \|' }).Count -gt 0) {
              $note = ("The signature is present and matches the configured certificate, but the self-signed development certificate does not chain to a trusted root on this runner. Import {0} before trusting these binaries elsewhere." -f $cerPath)
              Write-Warning $note
              Add-SummaryLine ''
              Add-SummaryLine $note
            }

            if ($failed.Count -gt 0) {
              throw ("Authenticode verification failed: {0}" -f ($failed -join '; '))
            }
            Write-Host 'Signed and verified the published flyout binaries.'
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      # A publish that verifies but cannot start is still broken. The flyout is a tray app and may
      # start hidden on a runner without an interactive desktop, so window visibility is not
      # asserted: process liveness, the diagnostic log and the Application event log are the
      # evidence. Start-Process gives a handle, which is more reliable than matching by name.
      - name: Smoke-launch the published flyout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'windows/artifacts/flyout-spike'
          $exe = Join-Path $output 'ItsycalForWindows.Flyout.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Cannot smoke-launch the flyout: $exe is missing."
          }
          if (-not $env:RUNNER_TEMP) {
            throw 'RUNNER_TEMP is not set; cannot create an isolated flyout log directory.'
          }

          $logDir = Join-Path $env:RUNNER_TEMP 'flyout-smoke'
          Remove-Item -LiteralPath $logDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $logPath = Join-Path $logDir 'itsycal-flyout.log'

          # The hardened app writes unhandled exceptions to its own crash log under
          # %LOCALAPPDATA%\Calwren\logs (the measurement log is diagnostics only). Read the same
          # known folder the app uses instead of assuming a profile path.
          $localAppData = [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)
          if (-not $localAppData) {
            throw 'LocalApplicationData could not be resolved; cannot check the flyout crash log.'
          }
          $crashLogPath = Join-Path $localAppData 'Calwren\logs\flyout-crash.log'
          $crashLogBefore = if (Test-Path -LiteralPath $crashLogPath) {
            (Get-Item -LiteralPath $crashLogPath).Length
          }
          else {
            -1
          }

          function Add-SummaryLine([string] $line) {
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $line
            }
          }

          $startedAt = Get-Date
          $appProcess = $null
          $alive = $false
          $exitCode = $null
          $logLines = @()
          $crashLines = @()
          $crashLogAfter = -1
          $newCrashBytes = 0
          $crashLogLine = ''
          $crashEvents = @()
          $eventCheckError = $null

          try {
            $env:ITSYCAL_FLYOUT_LOG_DIR = $logDir
            $appProcess = Start-Process -FilePath $exe -WorkingDirectory $output -PassThru
            Write-Host "Started the flyout (PID $($appProcess.Id)); waiting 7 s for startup."

            Start-Sleep -Seconds 7
            $appProcess.Refresh()
            $alive = -not $appProcess.HasExited
            if (-not $alive) {
              $exitCode = $appProcess.ExitCode
            }

            if (Test-Path -LiteralPath $logPath) {
              $logLines = @(Get-Content -LiteralPath $logPath -ErrorAction Stop)
              $crashLines = @($logLines | Where-Object { $_ -match 'UnhandledException|XamlParseException|0xC000027B' })
            }

            $crashLogAfter = if (Test-Path -LiteralPath $crashLogPath) {
              (Get-Item -LiteralPath $crashLogPath).Length
            }
            else {
              -1
            }
            if ($crashLogAfter -gt 0) {
              if ($crashLogBefore -lt 0) {
                $newCrashBytes = $crashLogAfter
              }
              elseif ($crashLogAfter -gt $crashLogBefore) {
                $newCrashBytes = $crashLogAfter - $crashLogBefore
              }
              elseif ($crashLogAfter -lt $crashLogBefore) {
                # Rotation replaces the previous file with a smaller one; treat it as new content.
                $newCrashBytes = $crashLogAfter
              }

              if ($newCrashBytes -gt 0) {
                $crashLogLine = (@(Get-Content -LiteralPath $crashLogPath -Tail 1 -ErrorAction SilentlyContinue) -join ' ')
              }
            }

            try {
              $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $startedAt } -ErrorAction Stop)
              $crashEvents = @(
                $events | Where-Object {
                  $_.Message -match 'ItsycalForWindows\.Flyout' -and
                  ($_.Message -match '0xC000027B' -or
                   $_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting'))
                }
              )
            }
            catch {
              if ($_.FullyQualifiedErrorId -match 'NoMatchingEventsFound' -or
                  $_.Exception.Message -match 'No events were found') {
                $crashEvents = @()
              }
              else {
                # A runner image without a readable Application log must not hide a live process:
                # report the limitation instead of failing the check itself.
                $eventCheckError = $_.Exception.Message
                Write-Warning "Could not read the Application event log: $eventCheckError"
              }
            }

            if ($alive) {
              $appProcess.Refresh()
              $alive = -not $appProcess.HasExited
              if (-not $alive) {
                $exitCode = $appProcess.ExitCode
              }
            }

            Add-SummaryLine '### Flyout smoke launch'
            Add-SummaryLine ''
            Add-SummaryLine ("Executable: ``$exe``")
            Add-SummaryLine ("Environment: ``ITSYCAL_FLYOUT_LOG_DIR=$logDir``")
            Add-SummaryLine ''

            $aliveText = if ($alive) { 'yes' } else { "no (exit code $exitCode)" }
            Add-SummaryLine ("- Process alive after 7 s: **{0}**" -f $aliveText)

            if ($crashLines.Count -gt 0) {
              $logText = "$($crashLines.Count) crash line(s)"
            }
            elseif ($logLines.Count -gt 0) {
              $logText = "$($logLines.Count) line(s), no crash marker"
            }
            else {
              $logText = 'not written'
            }
            Add-SummaryLine ("- Measurement log: {0}" -f $logText)

            if ($newCrashBytes -gt 0) {
              $crashLogText = "$newCrashBytes new byte(s)"
            }
            elseif ($crashLogAfter -ge 0) {
              $crashLogText = 'no new entries'
            }
            else {
              $crashLogText = 'not written'
            }
            Add-SummaryLine ("- Crash log (``$crashLogPath``): {0}" -f $crashLogText)

            if ($crashEvents.Count -gt 0) {
              $eventText = "$($crashEvents.Count) crash event(s)"
            }
            elseif ($eventCheckError) {
              $eventText = "not checked ($eventCheckError)"
            }
            else {
              $eventText = 'no crash events for ItsycalForWindows.Flyout'
            }
            Add-SummaryLine ("- Application event log: {0}" -f $eventText)
            Add-SummaryLine ''
            Add-SummaryLine 'Window visibility was not asserted: windows-latest may have no interactive desktop, so a hidden flyout is acceptable.'

            if (-not $alive) {
              throw "The flyout exited during the 7 s smoke window (exit code $exitCode)."
            }
            if ($crashLines.Count -gt 0) {
              throw ("The flyout diagnostic log contains a crash marker: {0}" -f $crashLines[0])
            }
            if ($newCrashBytes -gt 0) {
              throw ("The flyout wrote {0} byte(s) to its crash log: {1}" -f $newCrashBytes, $crashLogLine)
            }
            if ($crashEvents.Count -gt 0) {
              throw ("The Application event log contains {0} crash event(s) for the flyout." -f $crashEvents.Count)
            }

            Add-SummaryLine '**Result: PASS** - the published exe stayed alive and produced no crash evidence.'
            Write-Host 'Smoke launch passed: the flyout stayed alive for 7 s with no crash evidence.'
          }
          finally {
            if ($appProcess) {
              try {
                $appProcess.Refresh()
                if (-not $appProcess.HasExited) {
                  Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
                  $appProcess.WaitForExit(5000) | Out-Null
                }
              }
              catch {
                Write-Warning "Could not stop the smoke-launch process: $($_.Exception.Message)"
              }
            }
          }

      - name: Upload the flyout spike
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itsycal-flyout-spike
          path: windows/artifacts/flyout-spike/**
          if-no-files-found: error
