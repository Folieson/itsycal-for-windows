name: release

# Builds signed MSIX packages for x64 and arm64 from a v* tag, publishes a GitHub
# release, and prepares the WinGet manifests for submission.
#
# A WinGet submission requires a trusted code-signing certificate: `winget
# install` only accepts MSIX packages whose signature chains to a trusted root,
# and the manifest's SignatureSha256 is the hash of that signature. Without the
# signing secrets the workflow still produces a release, but marks it as a
# development build (prerelease, self-signed certificate attached) and refuses to
# prepare a WinGet submission.
#
# Required secrets for a signed release:
#   TRUSTED_SIGNING_PFX_BASE64    base64 of the .pfx with a trusted code-signing certificate
#   TRUSTED_SIGNING_PFX_PASSWORD  password of that .pfx
# Optional secret:
#   WINGET_PAT            GitHub token that may fork microsoft/winget-pkgs and open
#                         the WingetCreate submission pull request
#
# See docs/SIGNING.md for certificate options and the rotation procedure.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'Signing mode: auto (trusted cert if configured), trusted, or dev'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - trusted
          - dev

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve the release version and signing mode
        id: release_info
        shell: pwsh
        env:
          TRUSTED_SIGNING_PFX_BASE64: ${{ secrets.TRUSTED_SIGNING_PFX_BASE64 }}
          TRUSTED_SIGNING_PFX_PASSWORD: ${{ secrets.TRUSTED_SIGNING_PFX_PASSWORD }}
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          REQUESTED_SIGNING_MODE: ${{ inputs.signing_mode || 'auto' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tags must look like v1.0.0 (got '$tag')."
          }
          $version = $Matches['version']

          # The package identity is derived from the tag, never hand-maintained: the build
          # stamps Package.appxmanifest and the project metadata before packaging.
          $packageVersion = "$version.0"

          $requestedMode = if ([string]::IsNullOrWhiteSpace($env:REQUESTED_SIGNING_MODE)) { 'auto' } else { $env:REQUESTED_SIGNING_MODE }
          $hasTrustedSecrets = -not [string]::IsNullOrWhiteSpace($env:TRUSTED_SIGNING_PFX_BASE64)
          $hasTrustedPassword = -not [string]::IsNullOrWhiteSpace($env:TRUSTED_SIGNING_PFX_PASSWORD)

          if ($requestedMode -eq 'trusted' -and -not $hasTrustedSecrets) {
            throw "signing_mode=trusted was requested, but TRUSTED_SIGNING_PFX_BASE64 is not configured. The dev certificate (SIGNING_PFX_*) cannot produce a trusted release."
          }
          if ($hasTrustedSecrets -and -not $hasTrustedPassword) {
            throw "TRUSTED_SIGNING_PFX_BASE64 is configured without TRUSTED_SIGNING_PFX_PASSWORD; refusing an unverifiable trusted release."
          }

          $buildKind = if ($requestedMode -eq 'dev') { 'dev' } elseif ($hasTrustedSecrets) { 'trusted' } else { 'dev' }
          $wingetEnabled = if ([string]::IsNullOrWhiteSpace($env:WINGET_PAT)) { 'false' } else { 'true' }
          "VERSION=$version" >> $env:GITHUB_ENV
          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV
          "BUILD_KIND=$buildKind" >> $env:GITHUB_ENV
          "build_kind=$buildKind" >> $env:GITHUB_OUTPUT
          "winget_enabled=$wingetEnabled" >> $env:GITHUB_OUTPUT
          Write-Host "Release ${tag}: version $version, package version $packageVersion, signing mode $buildKind, winget automation $wingetEnabled."

      - name: Stamp the release package version
        shell: pwsh
        run: ./windows/scripts/Set-PackageVersion.ps1 -Version "$env:PACKAGE_VERSION"

      - name: Build and sign the MSIX packages
        shell: pwsh
        env:
          TRUSTED_SIGNING_PFX_BASE64: ${{ secrets.TRUSTED_SIGNING_PFX_BASE64 }}
          TRUSTED_SIGNING_PFX_PASSWORD: ${{ secrets.TRUSTED_SIGNING_PFX_PASSWORD }}
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = $null
          $devPfxPath = $null
          $arguments = @{ Version = $env:VERSION; Architectures = @('x64', 'arm64') }
          if ($env:BUILD_KIND -eq 'trusted') {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'itsycal-release.pfx'
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:TRUSTED_SIGNING_PFX_BASE64))
            $arguments.CertificatePath = $pfxPath
            $arguments.CertificatePassword = $env:TRUSTED_SIGNING_PFX_PASSWORD
          }
          elseif ($env:SIGNING_PFX_BASE64) {
            # Development prerelease, signed by the persistent development certificate so
            # developers who trusted its .cer can install every build without an admin step.
            Write-Host 'Using the persistent development certificate for a self-signed development release.'
            $devPfxPath = Join-Path $env:RUNNER_TEMP 'itsycal-dev.pfx'
            [System.IO.File]::WriteAllBytes($devPfxPath, [System.Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $arguments.CertificatePath = $devPfxPath
            $arguments.CertificatePassword = $env:SIGNING_PFX_PASSWORD
            $arguments.SkipSignatureVerification = $true
          }
          else {
            Write-Host 'No signing secrets: building a self-signed development release with an ephemeral certificate.'
            $arguments.SelfSigned = $true
          }
          try {
            & ./windows/scripts/Build-Release.ps1 @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Build-Release.ps1 failed (exit code $LASTEXITCODE)."
            }
            if ($devPfxPath) {
              # Attach the public certificate next to the packages; the release notes link it.
              $publicCert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($devPfxPath, $env:SIGNING_PFX_PASSWORD)
              $certAssetName = 'ItsycalForWindows_{0}_dev.cer' -f $env:PACKAGE_VERSION
              $releaseDir = Join-Path 'windows/artifacts/release' $env:VERSION
              Export-Certificate -Cert $publicCert -FilePath (Join-Path $releaseDir $certAssetName) -Force | Out-Null
              Write-Host "Exported the development certificate: $certAssetName"
            }
          }
          finally {
            foreach ($path in @($pfxPath, $devPfxPath)) {
              if ($path -and (Test-Path -LiteralPath $path)) {
                Remove-Item -LiteralPath $path -Force
              }
            }
          }

      - name: Prepare the WinGet manifests
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $version = $env:VERSION
          $packageVersion = $env:PACKAGE_VERSION
          $sourceRoot = 'winget/Folieson.ItsycalForWindows'
          $sourceDir = Join-Path $sourceRoot $version
          if (-not (Test-Path -LiteralPath $sourceDir)) {
            # No per-version directory: render this release's manifests from the newest
            # existing template. Release automation must not require a manual folder bump.
            $template = Get-ChildItem -LiteralPath $sourceRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1
            if (-not $template) {
              throw "No WinGet manifest template under $sourceRoot."
            }
            New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
            Copy-Item -Path (Join-Path $template.FullName '*.yaml') -Destination $sourceDir
            Write-Host "Rendered the WinGet manifests for $version from template $($template.Name)."
          }

          $buildInfo = Get-Content -LiteralPath "windows/artifacts/release/$version/build-info.json" -Raw | ConvertFrom-Json
          $manifestDir = "windows/artifacts/winget/$version"
          Remove-Item -LiteralPath $manifestDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          Copy-Item -Path (Join-Path $sourceDir '*.yaml') -Destination $manifestDir

          # Every manifest copy carries the release version, not the template version.
          foreach ($manifestFile in (Get-ChildItem -LiteralPath $manifestDir -Filter '*.yaml')) {
            $fileContent = Get-Content -LiteralPath $manifestFile.FullName -Raw
            $fileContent = $fileContent -replace '(?m)^PackageVersion:.*$', "PackageVersion: $version"
            Set-Content -LiteralPath $manifestFile.FullName -Value $fileContent -NoNewline -Encoding utf8
          }

          $installerPath = Join-Path $manifestDir 'Folieson.ItsycalForWindows.installer.yaml'
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Missing Folieson.ItsycalForWindows.installer.yaml in $sourceDir."
          }
          $architecture = $null
          $patched = foreach ($line in (Get-Content -LiteralPath $installerPath)) {
            if ($line -match '^\s*-?\s*Architecture:\s*(\w+)\s*$') {
              $architecture = $Matches[1].ToLowerInvariant()
            }
            $artifact = $buildInfo.artifacts | Where-Object { $_.architecture -eq $architecture } | Select-Object -First 1
            if ($line -match '^\s*InstallerUrl:') {
              if (-not $artifact) { throw "No build artifact for architecture '$architecture'." }
              $line = $line -replace 'InstallerUrl:.*', "InstallerUrl: https://github.com/$($env:SOURCE_REPOSITORY)/releases/download/$tag/$($artifact.file)"
            }
            elseif ($line -match '^\s*InstallerSha256:') {
              if (-not $artifact) { throw "No build artifact for architecture '$architecture'." }
              $line = $line -replace 'InstallerSha256:.*', "InstallerSha256: $($artifact.sha256.ToUpperInvariant())"
            }
            elseif ($line -match '^\s*SignatureSha256:') {
              if (-not $artifact) { throw "No build artifact for architecture '$architecture'." }
              $line = $line -replace 'SignatureSha256:.*', "SignatureSha256: $($artifact.signatureSha256.ToUpperInvariant())"
            }
            $line
          }
          Set-Content -LiteralPath $installerPath -Value @($patched) -Encoding utf8

          foreach ($file in (Get-ChildItem -LiteralPath $manifestDir -Filter '*.yaml')) {
            $content = Get-Content -LiteralPath $file.FullName -Raw
            if ($content -match '0{64}') {
              throw "The placeholder SHA256 in $($file.Name) was not replaced."
            }
            if ($content -notmatch 'ManifestVersion:\s*\d+\.\d+\.\d+') {
              throw "$($file.Name) does not declare a ManifestVersion."
            }
            if ($file.Name -like '*.installer.yaml') {
              $hashes = [regex]::Matches($content, '(?m)^\s*(Installer|Signature)Sha256:\s*[A-Fa-f0-9]{64}\s*$')
              if ($hashes.Count -ne 4) {
                throw "$($file.Name) must contain four SHA256 values (InstallerSha256 and SignatureSha256 for x64 and arm64)."
              }
            }
          }
          $installerContent = Get-Content -LiteralPath $installerPath -Raw
          if ($installerContent -notmatch '(?m)^InstallerType:\s*msix\s*$') {
            throw 'The installer manifest must declare InstallerType: msix.'
          }
          if ($installerContent -notmatch '(?m)^PackageFamilyName:\s*\S+\s*$') {
            throw 'The installer manifest must declare the MSIX PackageFamilyName.'
          }

          $zipName = "ItsycalForWindows_${packageVersion}_winget-manifests.zip"
          $zipPath = "windows/artifacts/release/$version/$zipName"
          Compress-Archive -Path (Join-Path $manifestDir '*') -DestinationPath $zipPath -Force
          Write-Host "Prepared the WinGet manifests for $version in $manifestDir."

      - name: Finalize the release assets and notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $version = $env:VERSION
          $packageVersion = $env:PACKAGE_VERSION
          $releaseDir = "windows/artifacts/release/$version"
          $repository = $env:GITHUB_REPOSITORY
          $baseUrl = "https://github.com/$repository/releases/download/$tag"

          $checksumFiles = @(Get-ChildItem -LiteralPath $releaseDir -File |
              Where-Object { $_.Name -notin @('SHA256SUMS.txt', 'build-info.json') } |
              Sort-Object Name)
          $checksumLines = @($checksumFiles | ForEach-Object {
                  '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
              })
          Set-Content -LiteralPath (Join-Path $releaseDir 'SHA256SUMS.txt') -Value $checksumLines -Encoding ascii

          $msixNames = @($checksumFiles | Where-Object { $_.Extension -eq '.msix' } | ForEach-Object { $_.Name })
          $cerName = @($checksumFiles | Where-Object { $_.Extension -eq '.cer' } | ForEach-Object { $_.Name }) | Select-Object -First 1
          $wingetZip = @($checksumFiles | Where-Object { $_.Name -like '*winget-manifests.zip' } | ForEach-Object { $_.Name }) | Select-Object -First 1

          $lines = @(
              "## Itsycal for Windows $version",
              '',
              'PowerToys Command Palette extension: an always-visible Dock band with the date and a month calendar with read-only events from the Windows appointment store.',
              '',
              '### Install',
              ''
          )
          if ($env:BUILD_KIND -eq 'trusted') {
            $lines += @(
                "Signed MSIX for $packageVersion. Download the package for your architecture and register it:",
                '',
                '```powershell',
                "Invoke-WebRequest $baseUrl/$($msixNames | Where-Object { $_ -like '*_x64.msix' } | Select-Object -First 1) -OutFile ItsycalForWindows_x64.msix",
                'Add-AppxPackage .\ItsycalForWindows_x64.msix',
                '```',
                '',
                'Use the `arm64` asset on Windows on ARM. Once the WinGet manifest is accepted, `winget install Folieson.ItsycalForWindows` installs this release.'
            )
          }
          else {
            $lines += @(
                '> **Development build.** The packages are signed with an ephemeral self-signed certificate and are not suitable for WinGet. Trust the certificate before installing:',
                '',
                '```powershell',
                "# elevated shell, once per release",
                "Import-Certificate -FilePath .\$cerName -CertStoreLocation Cert:\LocalMachine\TrustedPeople",
                "Add-AppxPackage .\ItsycalForWindows_${packageVersion}_x64.msix",
                '```',
                '',
                'A self-signed MSIX cannot be installed via `winget install`; cut a release with `TRUSTED_SIGNING_PFX_BASE64`/`TRUSTED_SIGNING_PFX_PASSWORD` set to publish a trusted build.'
            )
          }
          $lines += @(
              '',
              '### Assets',
              ''
          )
          foreach ($name in $msixNames) {
            $lines += "- ``$name`` - MSIX package"
          }
          if ($wingetZip) {
            $lines += "- ``$wingetZip`` - WinGet manifests prepared for this release (hashes and URLs filled in)"
          }
          if ($cerName) {
            $lines += "- ``$cerName`` - public development certificate (trust it before installing a development build)"
          }
          $lines += @(
              "- ``SHA256SUMS.txt`` - SHA256 of every asset",
              '',
              '### Verify',
              '',
              'Compare each download with `SHA256SUMS.txt` (`Get-FileHash <file> -Algorithm SHA256`).',
              '',
              "Full changelog: https://github.com/$repository/commits/$tag"
          )

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $lines -Encoding utf8
          "RELEASE_NOTES=$notesPath" >> $env:GITHUB_ENV
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $lines -Encoding utf8
          Write-Host "Release notes written to $notesPath."

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = "windows/artifacts/release/$($env:VERSION)"
          $assets = @(Get-ChildItem -LiteralPath $releaseDir -File |
              Where-Object { $_.Name -ne 'build-info.json' } |
              Sort-Object Name |
              Select-Object -ExpandProperty FullName)
          if ($assets.Count -lt 3) {
            throw "Expected at least three release assets, found $($assets.Count)."
          }
          $arguments = @('release', 'create', $env:RELEASE_TAG)
          $title = "Itsycal for Windows $($env:VERSION)"
          if ($env:BUILD_KIND -ne 'trusted') {
            $title = "$title (development build)"
            $arguments += '--prerelease'
          }
          $arguments += @('--title', $title, '--notes-file', $env:RELEASE_NOTES)
          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed (exit code $LASTEXITCODE)."
          }
          Write-Host "Published $($env:RELEASE_TAG) with $($assets.Count) assets."

      - name: Submit a WinGet update (optional)
        # Best effort: only runs for trusted builds with a WINGET_PAT secret. The
        # first package submission to microsoft/winget-pkgs is manual
        # (`wingetcreate new`); this step updates the already accepted package.
        # The release is published before this step, so a failure here does not
        # lose the artifacts.
        if: ${{ steps.release_info.outputs.build_kind == 'trusted' && steps.release_info.outputs.winget_enabled == 'true' }}
        continue-on-error: true
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $toolPath = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile $toolPath
          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $x64Url = "$baseUrl/ItsycalForWindows_$($env:PACKAGE_VERSION)_x64.msix"
          $arm64Url = "$baseUrl/ItsycalForWindows_$($env:PACKAGE_VERSION)_arm64.msix"
          & $toolPath update Folieson.ItsycalForWindows --version $env:VERSION --urls "$x64Url|x64" "$arm64Url|arm64" --token $env:WINGET_PAT --submit
          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate update failed (exit code $LASTEXITCODE)."
          }
