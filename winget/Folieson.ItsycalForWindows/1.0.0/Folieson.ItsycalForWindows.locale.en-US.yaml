ShortDescription: Date band and month calendar for the PowerToys Command Palette Dock.
Description: Itsycal for Windows adds an always-visible date band to the PowerToys Command Palette Dock. One click opens a 6x7 month calendar with ISO week numbers, a configurable first day of the week, and read-only events from the local Windows appointment store. No network access and no telemetry; calendar data never leaves the machine.
